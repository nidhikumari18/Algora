<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Algora Login</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="split-container">

  <!-- Left side: Login Box -->
  <div class="login-side">
    <div class="login-container">
      <h1 class="logo">Algora</h1>
      <p class="tagline">Learn • Help • Grow</p>

      <form class="login-form">
        <input type="text" placeholder="Username or Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Log In</button>
      </form>

      <div class="divider"><span></span><p>OR</p><span></span></div>

      <button class="google-btn">Log in with Google</button>

      <p class="forgot">Forgot password?</p>

      <div class="signup-box">
        <p>Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </div>

  <!-- Right side: Image -->
  <div class="image-side">
    <img src="your-image.jpg" alt="Study Image">
  </div>

</div>

</body>
</html>
