<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Algora Signup</title>
<link rel="stylesheet" href="signup.css">
</head>
<body class="login-body">

<div class="login-container">
  <h1 class="logo">Algora</h1>
  <p class="tagline">Join Algora and start learning!</p>

  <form class="login-form">
    <input type="text" placeholder="Full Name" required>
    <input type="text" placeholder="Username" required>
    <input type="email" placeholder="Email" required>
    <input type="password" placeholder="Password" required>
    <input type="password" placeholder="Confirm Password" required>
    <button type="submit">Sign Up</button>
  </form>

  <div class="divider"><span></span><p>OR</p><span></span></div>
 <button class="google-btn">Sign up with Google</button>
</div>

<div class="signup-box">
  <p>Already have an account? <a href="login.html"<span>Log in</span></p></a>
</div>

</body>
</html>
