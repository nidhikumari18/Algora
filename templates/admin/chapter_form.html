{% extends 'base.html' %}

{% block title %}{% if chapter %}Edit Chapter{% else %}Add Chapter{% endif %} - Admin{% endblock %}

{% block content %}
<div class="admin-container">
    <div class="admin-header">
        <h1>{% if chapter %}✏️ Edit Chapter{% else %}➕ Add Chapter{% endif %}</h1>
        <p class="subtitle">{{ subject.name }}</p>
    </div>
    
    <form method="POST" class="admin-form">
        <div class="form-group">
            <label for="name">Chapter Name *</label>
            <input type="text" id="name" name="name" value="{{ chapter.name if chapter else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ chapter.description if chapter else '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="order">Order</label>
            <input type="number" id="order" name="order" value="{{ chapter.order if chapter else 0 }}">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if chapter %}Update Chapter{% else %}Add Chapter{% endif %}</button>
            <a href="{{ url_for('admin_chapters', subject_id=subject.id) }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
